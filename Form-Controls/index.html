<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My form exercise</title>
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>

    <main>
      <form>
        <div>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required minlength="2" />
        </div>

        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>

        <fieldset>
          <legend>T-shirt colour</legend>

          <input type="radio" id="red" name="colour" value="red" required />
          <label for="red">Red</label>

          <input type="radio" id="blue" name="colour" value="blue" />
          <label for="blue">Blue</label>

          <input type="radio" id="green" name="colour" value="green" />
          <label for="green">Green</label>
        </fieldset>

        <div>
          <label for="size">Size</label>
          <select id="size" name="size" required>
            <option value="">Choose a size</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
        </div>

        <button type="submit">Buy</button>
      </form>
    </main>

    <footer>
      <h2>By Chaimaa Fikri</h2>
    </footer>
  </body>
</html>
